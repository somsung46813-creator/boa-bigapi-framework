<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" width="840" height="640" role="img" aria-labelledby="titleDesc">
  <title id="titleDesc">RGB Golden Ratio Abstract</title>
  <desc>Three radial lines in red, blue, and green with lengths proportional to the golden ratio (1 : φ : φ²).</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- center point -->
  <circle cx="80" cy="150" r="4" fill="#333" />

  <!-- green (shortest) -->
  <line x1="80" y1="150" x2="50" y2="98.04" stroke="#00aa00" stroke-width="6" stroke-linecap="round" />
  <!-- blue (middle) -->
  <line x1="80" y1="150" x2="171.15" y2="116.83" stroke="#00aaff" stroke-width="6" stroke-linecap="round" />
  <!-- red (longest) -->
  <line x1="80" y1="150" x2="200.26" y2="250.91" stroke="#ff3333" stroke-width="6" stroke-linecap="round" />

  <!-- labels -->
  <text x="44" y="86" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#006600">Green</text>
  <text x="172" y="110" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#006699">Blue</text>
  <text x="202" y="266" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#990000">Red</text>

  <!-- ratio annotation -->
  <text x="10" y="20" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222">Lengths approx: 1 : φ ≈ 1.618 : φ² ≈ 2.618</text>
  <text x="10" y="38" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#666">Center at (80,150). Angles chosen to reflect RGB separation for visualization.</text>

  <!-- subtle guide lines -->
  <line x1="80" y1="150" x2="400" y2="150" stroke="#eeeeee" stroke-width="1" />
  <line x1="80" y1="150" x2="80" y2="0" stroke="#eeeeee" stroke-width="1" />

  <!-- small phi symbol -->
  <text x="6" y="300" font-family="Georgia, serif" font-size="20" fill="#aa7700">φ — golden ratio</text>
</svg>
